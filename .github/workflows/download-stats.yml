# Saves the download count of every release once a day into downloads.csv on the `stats` branch.
# "[skip ci]" in the commit message stops Cloudflare Pages from building that branch.
name: Download stats
on:
  schedule:
    - cron: "17 4 * * *"   # every day, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: stats
      - name: Count downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/download_stats.py stats/downloads.csv
      - name: Commit
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv
          git diff --cached --quiet || git commit -m "[skip ci] Download stats $(date -u +%F)"
          git push
